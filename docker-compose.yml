services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    volumes:
      - postgres_data_rahavard:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6380:6379"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    env_file: .env
    depends_on:
      - db
      - redis
      - neo4j

  neo4j:
    image: neo4j:5-enterprise
    restart: always
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    ports:
      - "7475:7474"
      - "7688:7687"
    volumes:
      - neo4j_data_rahavard:/data
      - neo4j_logs_rahavard:/logs
      - neo4j_plugins_rahavard:/plugins

volumes:
  postgres_data_rahavard:
  neo4j_data_rahavard:
  neo4j_logs_rahavard:
  neo4j_plugins_rahavard:
